<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台</title>
<style>
  :root{--brand:#6366f1;--brand2:#8b5cf6;--bg:#f5f6fb;--text:#1f2430;--muted:#6b7280;
    --border:#e6e8f0;--ok:#10b981;--danger:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px}
  .header{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;height:56px}
  .logo{font-weight:800;color:var(--brand)}
  .header button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
  .layout{display:flex;min-height:calc(100vh - 56px)}
  .side{width:180px;background:#fff;border-right:1px solid var(--border);padding:14px 10px;
    display:flex;flex-direction:column;gap:4px}
  .side a{padding:10px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600}
  .side a.active,.side a:hover{background:#eef2ff;color:var(--brand)}
  .main{flex:1;padding:24px;overflow:auto}
  h2{font-size:18px;margin-bottom:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
    border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));font-family:inherit}
  .btn.small{padding:5px 11px;font-size:12px}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);
    border-radius:9px;font-size:13.5px;font-family:inherit;outline:none;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical;min-height:110px;line-height:1.6;
    font-family:ui-monospace,Consolas,monospace}
  .bar input,.bar select{width:auto;min-width:160px}
  table{width:100%;background:#fff;border-radius:12px;border-collapse:collapse;
    overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.04)}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  th{background:#fafbff;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  .tag{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
  .tag.pending{background:#fef3c7;color:#92400e}
  .tag.paid{background:#d1fae5;color:#065f46}
  .tag.closed,.tag.expired{background:#f3f4f6;color:#6b7280}
  .tag.used{background:#f3f4f6;color:#9ca3af}
  .tag.free{background:#d1fae5;color:#065f46}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
  .stat .v{font-size:26px;font-weight:800;color:var(--brand);margin-top:4px}
  .stat .l{color:var(--muted);font-size:12.5px}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:460px;
    max-height:88vh;overflow:auto}
  .modal h3{font-size:16px;margin-bottom:6px}
  .field{margin:12px 0}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#fff;border:1px solid var(--border);border-radius:18px;
    padding:30px;width:100%;max-width:360px}
  .login-box h1{font-size:20px;margin-bottom:4px}
  .login-box p{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
  .empty{text-align:center;color:var(--muted);padding:40px}
  @media(max-width:640px){
    .side{width:100%;flex-direction:row;overflow-x:auto}
    .layout{flex-direction:column}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
/* ============================================================
 *  ⚠️ 部署前必改：把下面地址换成你的 Worker 地址
 *  （末尾不带斜杠）
 * ============================================================ */
const API_BASE = 'https://card-shop-api.你的子域.workers.dev';

/* ============================================================ */

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));
const yuan = c => (Number(c||0)/100).toFixed(2);
const STATUS = {pending:'待支付',paid:'已支付',expired:'已过期',closed:'已关闭'};

let token = localStorage.getItem('admin_token') || '';
let current = 'dashboard';

async function api(path, opts={}){
  const res = await fetch(API_BASE + '/api' + path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json',
      ...(token ? {Authorization:'Bearer '+token} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(()=>({}));
  if(res.status === 401){ logout(); throw new Error('登录已过期'); }
  if(!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

/* ---------- 登录 ---------- */
function renderLogin(errMsg=''){
  $('#modal').innerHTML = '';
  $('#app').innerHTML = `
    <div class="login-wrap"><div class="login-box">
      <h1>管理后台</h1>
      <p>自动发卡平台 · 管理员登录</p>
      <div class="field"><label>用户名</label>
        <input id="u" autocomplete="username"></div>
      <div class="field"><label>密码</label>
        <input id="p" type="password" autocomplete="current-password"></div>
      <div class="err" id="err">${esc(errMsg)}</div>
      <button class="btn" style="width:100%;margin-top:14px" id="loginBtn">登 录</button>
    </div></div>`;
  const go = async () => {
    const btn = $('#loginBtn');
    btn.disabled = true; btn.textContent = '登录中…';
    try{
      const r = await fetch(API_BASE + '/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username: $('#u').value.trim(), password: $('#p').value})
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || '登录失败');
      token = data.token; localStorage.setItem('admin_token', token);
      boot();
    }catch(e){ renderLogin(e.message); }
  };
  $('#loginBtn').onclick = go;
  $('#p').onkeydown = e => { if(e.key==='Enter') go(); };
}

function logout(){
  token=''; localStorage.removeItem('admin_token'); renderLogin();
}

/* ---------- 主框架 ---------- */
const MENU = [
  ['dashboard','仪表盘'],['products','商品管理'],['cards','卡密管理'],
  ['orders','订单管理'],['settings','系统设置']
];

function renderShell(){
  $('#app').innerHTML = `
    <div class="header">
      <div class="logo">⚙️ 自动发卡 · 管理后台</div>
      <button id="logoutBtn">退出登录</button>
    </div>
    <div class="layout">
      <nav class="side" id="side"></nav>
      <main class="main" id="main"></main>
    </div>`;
  $('#side').innerHTML = MENU.map(([k,t]) =>
    `<a data-tab="${k}" class="${k===current?'active':''}">${t}</a>`).join('');
  $('#side').onclick = e => {
    const a = e.target.closest('[data-tab]'); if(!a) return;
    current = a.dataset.tab; renderShell(); renderTab();
  };
  $('#logoutBtn').onclick = logout;
}

function renderTab(){
  $('#main').innerHTML = `<div class="empty">加载中…</div>`;
  if(current==='dashboard') return renderDashboard();
  if(current==='products') return renderProducts();
  if(current==='cards') return renderCards();
  if(current==='orders') return renderOrders();
  if(current==='settings') return renderSettings();
}

/* ---------- 仪表盘 ---------- */
async function renderDashboard(){
  try{
    const s = await api('/admin/stats');
    $('#main').innerHTML = `
      <h2>仪表盘</h2>
      <div class="stats">
        <div class="stat"><div class="l">商品数量</div><div class="v">${s.productCount}</div></div>
        <div class="stat"><div class="l">订单总数</div><div class="v">${s.orderCount}</div></div>
        <div class="stat"><div class="l">已支付订单</div><div class="v">${s.paidOrderCount}</div></div>
        <div class="stat"><div class="l">总收入</div><div class="v">¥${yuan(s.revenue)}</div></div>
        <div class="stat"><div class="l">卡密总量</div><div class="v">${s.cardTotal}</div></div>
        <div class="stat"><div class="l">已售卡密</div><div class="v">${s.cardUsed}</div></div>
      </div>`;
  }catch(e){ $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 商品 ---------- */
async function renderProducts(){
  try{
    const list = await api('/admin/products');
    $('#main').innerHTML = `
      <h2>商品管理</h2>
      <div class="bar"><button class="btn" id="addBtn">+ 新建商品</button></div>
      <table><thead><tr>
        <th>名称</th><th>价格</th><th>库存</th><th>描述</th>
        <th style="width:150px">操作</th>
      </tr></thead>
      <tbody>${list.length ? list.map(p => `
        <tr><td><b>${esc(p.name)}</b></td>
        <td style="color:var(--danger);font-weight:700">¥${yuan(p.price)}</td>
        <td>${p.stock}</td>
        <td style="color:#6b7280">${esc(p.description||'-')}</td>
        <td>
          <button class="btn small ghost" data-edit="${p.id}">编辑</button>
          <button class="btn small danger" data-del="${p.id}">删除</button>
        </td></tr>`).join('')
        : `<tr><td colspan="5" class="empty">暂无商品</td></tr>`}
      </tbody></table>`;
    $('#addBtn').onclick = () => productModal();
    $('#main').onclick = e => {
      const ed = e.target.closest('[data-edit]'), de = e.target.closest('[data-del]');
      if(ed) productModal(list.find(x=>x.id===ed.dataset.edit));
      if(de) delProduct(de.dataset.del);
    };
  }catch(e){ $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function productModal(p){
  const isEdit = !!p;
  p = p || {name:'',price:'',description:'',cover:''};
  $('#modal').innerHTML = `
    <div class="modal-mask"><div class="modal">
      <h3>${isEdit?'编辑商品':'新建商品'}</h3>
      <div class="field"><label>商品名称 *</label>
        <input id="m_name" value="${esc(p.name)}"></div>
      <div class="field"><label>价格（元）*</label>
        <input id="m_price" type="number" step="0.01" min="0.01"
          value="${p.price?(p.price/100).toFixed(2):''}"></div>
      <div class="field"><label>描述</label>
        <textarea id="m_desc" style="min-height:70px">${esc(p.description||'')}</textarea></div>
      <div class="field"><label>封面（图片 URL 或 emoji）</label>
        <input id="m_cover" value="${esc(p.cover||'')}"></div>
      <div class="err" id="m_err"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="m_cancel">取消</button>
        <button class="btn" id="m_save">保存</button>
      </div>
    </div></div>`;
  $('#m_cancel').onclick = () => { $('#modal').innerHTML=''; };
  $('#m_save').onclick = async () => {
    const name = $('#m_name').value.trim();
    const priceYuan = Number($('#m_price').value);
    if(!name) return $('#m_err').textContent = '请填写商品名称';
    if(!(priceYuan > 0)) return $('#m_err').textContent = '价格必须大于 0';
    const body = {
      name, price: Math.round(priceYuan*100),
      description: $('#m_desc').value.trim(),
      cover: $('#m_cover').value.trim()
    };
    try{
      if(isEdit) await api('/admin/products/'+p.id, {method:'PUT', body});
      else await api('/admin/products', {method:'POST', body});
      $('#modal').innerHTML=''; renderProducts();
    }catch(e){ $('#m_err').textContent = e.message; }
  };
}

async function delProduct(id){
  if(!confirm('删除商品？该商品未售出的卡密也会一并删除。')) return;
  try{ await api('/admin/products/'+id, {method:'DELETE'}); renderProducts(); }
  catch(e){ alert(e.message); }
}

/* ---------- 卡密 ---------- */
let cardProductId = '';
async function renderCards(){
  try{
    const products = await api('/admin/products');
    if(!products.length){
      $('#main').innerHTML = `<h2>卡密管理</h2>
        <div class="empty">请先创建商品</div>`; return;
    }
    if(!cardProductId || !products.find(p=>p.id===cardProductId))
      cardProductId = products[0].id;
    const cards = await api(`/admin/products/${cardProductId}/cards`);
    const free = cards.filter(c=>!c.used).length;

    $('#main').innerHTML = `
      <h2>卡密管理</h2>
      <div class="bar">
        <select id="prodSel">${products.map(p =>
          `<option value="${p.id}" ${p.id===cardProductId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <button class="btn" id="addCards">+ 批量添加卡密</button>
        <span style="color:#6b7280;font-size:13px">可用 ${free} / 共 ${cards.length}</span>
      </div>
      <table><thead><tr>
        <th>卡密</th><th>状态</th><th>关联订单</th>
        <th style="width:100px">操作</th>
      </tr></thead>
      <tbody>${cards.length ? cards.map(c => `
        <tr>
          <td style="font-family:ui-monospace,Consolas,monospace">${esc(c.code)}</td>
          <td><span class="tag ${c.used?'used':'free'}">${c.used?'已售':'可用'}</span></td>
          <td style="color:#6b7280">${esc(c.orderNo||'-')}</td>
          <td>${c.used?'':'<button class="btn small danger" data-card="'+c.id+'">删除</button>'}</td>
        </tr>`).join('')
        : `<tr><td colspan="4" class="empty">暂无卡密，点击上方按钮添加</td></tr>`}
      </tbody></table>`;

    $('#prodSel').onchange = e => { cardProductId = e.target.value; renderCards(); };
    $('#addCards').onclick = () => addCardsModal();
    $('#main').onclick = e => {
      const b = e.target.closest('[data-card]');
      if(b && confirm('删除该卡密？'))
        api('/admin/cards/'+b.dataset.card, {method:'DELETE'})
          .then(renderCards).catch(x=>alert(x.message));
    };
  }catch(e){ $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function addCardsModal(){
  $('#modal').innerHTML = `
    <div class="modal-mask"><div class="modal">
      <h3>批量添加卡密</h3>
      <p style="color:#6b7280;font-size:12.5px">每行一条，自动去重</p>
      <div class="field">
        <textarea id="codes" placeholder="ABCD-1234&#10;EFGH-5678"></textarea>
      </div>
      <div class="err" id="c_err"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="c_cancel">取消</button>
        <button class="btn" id="c_save">添加</button>
      </div>
    </div></div>`;
  $('#c_cancel').onclick = () => { $('#modal').innerHTML=''; };
  $('#c_save').onclick = async () => {
    try{
      const r = await api(`/admin/products/${cardProductId}/cards`, {
        method:'POST', body:{codes: $('#codes').value}
      });
      $('#modal').innerHTML='';
      alert(`添加成功 ${r.added} 条，跳过重复 ${r.skipped} 条`);
      renderCards();
    }catch(e){ $('#c_err').textContent = e.message; }
  };
}

/* ---------- 订单 ---------- */
async function renderOrders(){
  const status = $('#orderStatus')?.value || '';
  const kw = $('#orderKw')?.value || '';
  try{
    const qs = new URLSearchParams();
    if(status) qs.set('status', status);
    if(kw) qs.set('keyword', kw);
    const list = await api('/admin/orders?' + qs.toString());
    $('#main').innerHTML = `
      <h2>订单管理</h2>
      <div class="bar">
        <select id="orderStatus">
          <option value="">全部状态</option>
          ${Object.entries(STATUS).map(([k,v])=>
            `<option value="${k}" ${k===status?'selected':''}>${v}</option>`).join('')}
        </select>
        <input id="orderKw" placeholder="订单号 / 商品 / 联系方式" value="${esc(kw)}">
        <button class="btn ghost" id="orderSearch">搜索</button>
      </div>
      <table><thead><tr>
        <th>订单号</th><th>商品</th><th>数量</th><th>金额</th>
        <th>状态</th><th>联系方式</th><th style="width:130px">操作</th>
      </tr></thead>
      <tbody>${list.length ? list.map(o=>`
        <tr>
          <td style="font-family:ui-monospace;font-size:12px">${esc(o.orderNo)}</td>
          <td>${esc(o.productName)}</td><td>${o.quantity}</td>
          <td>¥${yuan(o.amount)}</td>
          <td><span class="tag ${o.status}">${STATUS[o.status]||o.status}</span></td>
          <td style="color:#6b7280">${esc(o.contact||'-')}</td>
          <td>
            ${o.status==='pending'?`<button class="btn small ghost" data-close="${o.orderNo}">关闭</button> `:''}
            <button class="btn small danger" data-odel="${o.orderNo}">删除</button>
          </td></tr>`).join('')
        : `<tr><td colspan="7" class="empty">暂无订单</td></tr>`}
      </tbody></table>`;

    $('#orderSearch').onclick = renderOrders;
    $('#orderStatus').onchange = renderOrders;
    $('#orderKw').onkeydown = e => { if(e.key==='Enter') renderOrders(); };
    $('#main').onclick = e => {
      const cl = e.target.closest('[data-close]'), de = e.target.closest('[data-odel]');
      if(cl && confirm('关闭该订单？'))
        api('/admin/orders/'+cl.dataset.close+'/close',{method:'POST'})
          .then(renderOrders).catch(x=>alert(x.message));
      if(de && confirm('删除该订单记录？'))
        api('/admin/orders/'+de.dataset.odel,{method:'DELETE'})
          .then(renderOrders).catch(x=>alert(x.message));
    };
  }catch(e){ $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 设置 ---------- */
async function renderSettings(){
  try{
    const s = await api('/admin/settings');
    $('#main').innerHTML = `
      <h2>系统设置</h2>
      <div style="background:#fff;border:1px solid var(--border);border-radius:14px;
                  padding:20px;max-width:560px">
        <div class="field"><label>站点名称</label>
          <input id="s_name" value="${esc(s.siteName)}"></div>
        <div class="field"><label>站点公告</label>
          <textarea id="s_notice" style="min-height:70px">${esc(s.siteNotice||'')}</textarea></div>
        <div class="field"><label>联系方式（页脚）</label>
          <input id="s_contact" value="${esc(s.contact||'')}"></div>
        <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
        <div class="field"><label>管理员用户名</label>
          <input id="s_user" value="${esc(s.adminUsername)}"></div>
        <div class="field"><label>新密码（留空则不修改）</label>
          <input id="s_pass" type="password" placeholder="修改后需重新登录"></div>
        <div class="err" id="s_err"></div>
        <button class="btn" id="s_save">保存设置</button>
      </div>`;
    $('#s_save').onclick = async () => {
      try{
        const r = await api('/admin/settings',{method:'PUT', body:{
          siteName: $('#s_name').value.trim(),
          siteNotice: $('#s_notice').value.trim(),
          contact: $('#s_contact').value.trim(),
          adminUsername: $('#s_user').value.trim(),
          adminPassword: $('#s_pass').value
        }});
        if(r.relogin){ alert('密码已修改，请重新登录'); logout(); }
        else alert('保存成功');
      }catch(e){ $('#s_err').textContent = e.message; }
    };
  }catch(e){ $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 启动 ---------- */
function boot(){
  if(!token) return renderLogin();
  renderShell(); renderTab();
}
boot();
</script>
</body>
</html>
