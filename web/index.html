<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动发卡平台</title>
<style>
  :root{
    --bg: #09090b; --card-bg: rgba(255, 255, 255, 0.03);
    --text: #f4f4f5; --muted: #a1a1aa;
    --border: rgba(255, 255, 255, 0.1); --border-hover: rgba(255, 255, 255, 0.25);
    --primary: #6366f1; --primary-glow: rgba(99, 102, 241, 0.5);
    --price: #10b981; --danger: #ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    background-color:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; overflow-x:hidden;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; background-position: center top;
  }
  body::before{
    content:''; position:absolute; top:-20%; left:50%; transform:translateX(-50%);
    width:80%; height:50%; background:radial-gradient(ellipse at center, rgba(99,102,241,0.15) 0%, transparent 70%);
    z-index:-1; pointer-events:none;
  }
  a{color:inherit;text-decoration:none}
  
  .header{position:sticky;top:0;z-index:50;background:rgba(9,9,11,.7);
    backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .header-inner{max-width:1100px;margin:0 auto;padding:18px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;letter-spacing:-0.5px}
  .header-actions{display:flex;gap:12px;align-items:center}
  
  #app{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:60px 20px 100px}
  
  .hero{text-align:center;padding:20px 0 60px;animation:fadeUp .6s ease}
  .hero h1{font-size:42px;letter-spacing:-1.5px;margin-bottom:16px;font-weight:900;
    background:linear-gradient(to bottom right, #fff, #a1a1aa);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .badge{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  
  .notice{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#fcd34d;
    padding:14px 20px;border-radius:12px;font-size:14px;margin-bottom:32px;display:flex;align-items:center;gap:10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;
    overflow:hidden;display:flex;flex-direction:column;transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter:blur(10px);position:relative}
  .card::after{content:'';position:absolute;inset:0;border-radius:20px;padding:2px;
    background:linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
  .card:hover{transform:translateY(-4px);border-color:var(--border-hover);
    box-shadow:0 20px 40px -10px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow)}
  .card-cover{height:140px;display:flex;align-items:center;justify-content:center;
    font-size:56px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent)}
  .card-cover img{width:100%;height:100%;object-fit:cover;opacity:0.9}
  .card-body{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
  .card-body h3{font-size:18px;font-weight:700;letter-spacing:-0.3px}
  .desc{font-size:13.5px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .price{color:var(--price);font-weight:900;font-size:28px;display:flex;align-items:baseline;letter-spacing:-0.5px}
  .price::before{content:'¥';font-size:16px;margin-right:4px;font-weight:600;color:var(--muted)}
  .stock{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:20px;border:1px solid var(--border)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 24px;border-radius:12px;border:none;cursor:pointer;font-size:14px;
    font-weight:600;font-family:inherit;color:#fff;
    background:#fff;color:#000; transition:all .2s}
  .btn:hover{filter:brightness(0.9);transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,255,255,0.2)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(1);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:rgba(255,255,255,0.05);box-shadow:none}
  .btn.small{padding:8px 16px;font-size:13px;border-radius:8px}
  .btn.big{width:100%;padding:18px;font-size:16px;border-radius:14px;margin-top:24px;background:linear-gradient(135deg, var(--primary), #a855f7);color:#fff;border:none;box-shadow:0 0 20px var(--primary-glow)}
  .btn.big:hover{box-shadow:0 0 30px var(--primary-glow);filter:brightness(1.1)}
  .buy{width:100%;margin-top:16px;background:var(--text);color:#000}

  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600}
  input,textarea,select{width:100%;padding:14px 16px;border:1px solid var(--border);
    border-radius:12px;font-size:14px;font-family:inherit;color:var(--text);
    background:rgba(0,0,0,0.2);outline:none;transition:all .2s}
  input:focus,textarea:focus,select:focus{background:rgba(0,0,0,0.5);border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,.2)}

  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(8px);animation:fadeIn .2s ease}
  .modal{background:#18181b;border:1px solid var(--border);border-radius:24px;padding:32px;width:100%;max-width:420px;
    max-height:88vh;overflow-y:auto;animation:scaleUp .3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
  .modal h3{font-size:22px;margin-bottom:8px}
  .modal-actions{display:flex;gap:12px;margin-top:28px}
  .modal-actions .btn{flex:1}
  .total{margin-top:24px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.03);padding:20px;border-radius:16px;border:1px solid var(--border)}
  .total strong{color:var(--price);font-size:28px;font-weight:900}

  .order-wrap{max-width:680px;margin:0 auto}
  .order-wrap h2{font-size:28px;margin-bottom:24px;font-weight:800;letter-spacing:-0.5px}
  .order-info{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;
    padding:0 24px; backdrop-filter:blur(10px)}
  .order-info>div{display:flex;justify-content:space-between;gap:16px;
    padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px}
  .order-info>div:last-child{border-bottom:none}
  .order-info span{color:var(--muted)}
  .order-info b{text-align:right;word-break:break-all;font-weight:600}

  .st-pending{color:#fcd34d;background:rgba(245,158,11,.1);padding:4px 12px;border-radius:6px;font-size:12px;border:1px solid rgba(245,158,11,.2)}
  .st-paid{color:#34d399;background:rgba(16,185,129,.1);padding:4px 12px;border-radius:6px;font-size:12px;border:1px solid rgba(16,185,129,.2)}
  .st-expired,.st-closed{color:#a1a1aa;background:rgba(255,255,255,.05);padding:4px 12px;border-radius:6px;font-size:12px;border:1px solid var(--border)}

  .cards-box{background:linear-gradient(180deg, rgba(16,185,129,0.05), transparent);border:1px solid rgba(16,185,129,0.2);border-radius:20px;
    padding:28px;margin-top:24px}
  .cards-box h3{font-size:16px;margin-bottom:20px;color:#34d399;display:flex;align-items:center;gap:8px}
  .card-code{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(16,185,129,0.3);border-radius:12px;padding:16px 20px;margin-bottom:12px}
  .card-code code{flex:1;font-size:15px;word-break:break-all;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;font-weight:600;letter-spacing:1px}
  .card-code .copy{background:rgba(16,185,129,0.2);color:#34d399;border:none}
  .card-code .copy:hover{background:rgba(16,185,129,0.3)}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}

  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px;
    background:rgba(255,255,255,0.02);border-radius:20px;border:1px dashed var(--border)}
  .loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:14px}
  .footer{border-top:1px solid var(--border);padding:32px 20px;text-align:center;
    font-size:13px;color:var(--muted);background:#09090b}
  
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scaleUp{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}

  @media(max-width:520px){
    .hero h1{font-size:32px}
    #app{padding:30px 16px 60px}
    .grid{grid-template-columns:1fr}
    .card{flex-direction:row;align-items:center;padding:16px;border-radius:16px}
    .card-cover{height:80px;width:80px;border-radius:12px;font-size:36px;flex-shrink:0}
    .card-body{padding:0 0 0 16px;gap:8px}
    .price{font-size:22px}
    .buy{margin-top:8px;padding:10px;font-size:13px}
    .order-info{padding:0 16px;border-radius:16px}
    .cards-box{padding:20px 16px;border-radius:16px}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">🛍️ <span id="siteName">自动发卡</span></div>
    <div class="header-actions">
      <button class="btn ghost small" id="queryBtn">订单查询</button>
      <a class="btn ghost small" id="adminLink" href="#" target="_blank">管理后台</a>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <div id="contact">联系客服</div>
  <div style="margin-top:8px;font-size:12px;opacity:.4">© 自动发卡平台 · 安全稳定 · 自动发货</div>
</footer>

<div id="modal"></div>

<script>
const API_BASE = 'https://bmw-shop-api.968888u.workers.dev';
const ADMIN_URL = 'https://bmw-admin.pages.dev';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const yuan = c => (Number(c || 0) / 100).toFixed(2);

let site = { siteName: '自动发卡', siteNotice: '', contact: '' };
let products = [];

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + '/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

(async function boot() {
  $('#adminLink').href = ADMIN_URL;
  try {
    site = await api('/site');
    document.title = site.siteName;
    $('#siteName').textContent = site.siteName;
    if(site.contact) $('#contact').textContent = site.contact;
  } catch (e) {}
  await refreshProducts();
  $('#queryBtn').onclick = openQueryModal;
  window.addEventListener('hashchange', render);
  render();
})();

async function refreshProducts() {
  try { products = await api('/products'); } catch (e) { products = []; }
}

function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/order\/([A-Za-z0-9]+)$/);
  if (m) renderOrder(m[1]);
  else renderHome();
}

function renderHome() {
  const app = $('#app');
  const notice = site.siteNotice ? `<div class="notice"><span>📢</span> ${esc(site.siteNotice)}</div>` : '';
  const grid = products.length
    ? products.map(p => `
      <div class="card">
        <div class="card-cover">${coverHtml(p.cover)}</div>
        <div class="card-body">
          <h3>${esc(p.name)}</h3>
          <p class="desc">${esc(p.description || '暂无描述')}</p>
          <div class="card-foot">
            <span class="price">${yuan(p.price)}</span>
            <span class="stock">库存 ${p.stock}</span>
          </div>
          <button class="btn buy" data-buy="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock > 0 ? '立即购买' : '已售罄'}
          </button>
        </div>
      </div>`).join('')
    : `<div class="empty">🛒 暂无在售商品</div>`;

  app.innerHTML = `
    <div class="hero">
      <h1>${esc(site.siteName)}</h1>
      <p>全天候自动发货 <span class="badge">安全可靠</span></p>
    </div>
    ${notice}
    <div class="grid">${grid}</div>`;

  app.querySelectorAll('[data-buy]').forEach(btn => {
    btn.onclick = () => openBuyModal(btn.dataset.buy);
  });
}

function coverHtml(cover) {
  if (cover && /^https?:\/\//i.test(cover)) return `<img src="${esc(cover)}" alt="" loading="lazy">`;
  return esc(cover || '🎁');
}

function openBuyModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>购买确认</h3>
        <p style="font-size:14px;color:var(--muted);margin-top:4px">${esc(p.name)}</p>
        <label>购买数量</label>
        <input type="number" id="qty" value="1" min="1" max="${Math.min(100, p.stock)}">
        <label>联系方式（选填）</label>
        <input type="text" id="contact" placeholder="邮箱 / QQ / 手机号">
        <div class="total">应付金额 <strong id="total">¥${yuan(p.price)}</strong></div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancel">取消</button>
          <button class="btn big" style="margin-top:0" id="confirm">去支付</button>
        </div>
      </div>
    </div>`;

  const qtyEl = $('#qty', m);
  const totalEl = $('#total', m);
  const readQty = () => Math.max(1, Math.min(p.stock, Math.floor(Number(qtyEl.value) || 1)));
  
  qtyEl.oninput = () => { totalEl.textContent = '¥' + yuan(p.price * readQty()); };
  $('#cancel', m).onclick = () => { m.innerHTML = ''; };
  $('#confirm', m).onclick = async () => {
    const btn = $('#confirm', m);
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const order = await api('/orders', {
        method: 'POST',
        body: { productId: p.id, quantity: readQty(), contact: $('#contact', m).value.trim() },
      });
      m.innerHTML = '';
      location.hash = '#/order/' + order.orderNo;
    } catch (e) {
      alert(e.message); btn.disabled = false; btn.textContent = '去支付';
    }
  };
}

const STATUS_TEXT = { pending:'待支付', paid:'已支付', expired:'已过期', closed:'已关闭' };

async function renderOrder(orderNo) {
  const app = $('#app');
  app.innerHTML = `<div class="loading">订单加载中…</div>`;
  let order;
  try {
    order = await api('/orders/' + encodeURIComponent(orderNo));
  } catch (e) {
    app.innerHTML = `<div class="empty">❌ 订单不存在或链接已失效</div>`;
    return;
  }

  let html = `
    <div class="order-wrap">
      <h2>订单详情</h2>
      <div class="order-info">
        <div><span>订单号</span><b>${esc(order.orderNo)}</b></div>
        <div><span>商品名称</span><b>${esc(order.productName)}</b></div>
        <div><span>购买数量</span><b>${order.quantity}</b></div>
        <div><span>订单金额</span><b class="price" style="font-size:18px">¥${yuan(order.amount)}</b></div>
        <div><span>订单状态</span><b class="st-${order.status}">${STATUS_TEXT[order.status] || order.status}</b></div>
      </div>`;

  if (order.status === 'paid') {
    html += `
      <div class="cards-box">
        <h3>✅ 发货成功，请及时保存</h3>
        ${order.cards.map((c, i) => `
          <div class="card-code">
            <code>${esc(c.code)}</code>
            <button class="btn small copy" data-i="${i}">复制</button>
          </div>`).join('')}
      </div>`;
  } else if (order.status === 'pending') {
    html += `
      <button class="btn big" id="payBtn">立即支付 ¥${yuan(order.amount)}</button>
      <p class="hint">点击即模拟支付成功并自动发货</p>`;
  } else {
    html += `<p class="hint">该订单${STATUS_TEXT[order.status] || '状态未知'}，请重新下单</p>`;
  }

  html += `</div>`;
  app.innerHTML = html;

  const payBtn = $('#payBtn', app);
  if (payBtn) {
    payBtn.onclick = async () => {
      payBtn.disabled = true; payBtn.textContent = '支付处理中…';
      try {
        await api('/orders/' + encodeURIComponent(orderNo) + '/pay', { method: 'POST' });
        await refreshProducts();
        renderOrder(orderNo);
      } catch (e) {
        alert(e.message); payBtn.disabled = false; payBtn.textContent = '立即支付 ¥' + yuan(order.amount);
      }
    };
  }

  app.querySelectorAll('.copy').forEach(b => {
    b.onclick = () => {
      const code = order.cards[Number(b.dataset.i)].code;
      navigator.clipboard.writeText(code).then(() => {
        b.textContent = '已复制';
        setTimeout(() => { b.textContent = '复制'; }, 1500);
      }).catch(() => alert('复制失败，请手动选中复制'));
    };
  });
}

function openQueryModal() {
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>订单查询</h3>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px">输入订单号找回您的卡密</p>
        <input id="qno" placeholder="粘贴您的订单号">
        <div class="modal-actions">
          <button class="btn ghost" id="qCancel">取消</button>
          <button class="btn big" style="margin-top:0" id="qGo">查询</button>
        </div>
      </div>
    </div>`;
  const input = $('#qno', m);
  input.focus();
  $('#qCancel', m).onclick = () => { m.innerHTML = ''; };
  const go = () => {
    const no = input.value.trim();
    if (!no) return;
    m.innerHTML = '';
    location.hash = '#/order/' + encodeURIComponent(no);
  };
  $('#qGo', m).onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}
</script>
</body>
</html>
