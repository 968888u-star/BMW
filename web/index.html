<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动发卡</title>
<style>
  :root{
    --brand:#6366f1; --brand-2:#8b5cf6;
    --bg:#f5f6fb; --text:#1f2430; --muted:#6b7280;
    --border:#e6e8f0; --ok:#10b981; --danger:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .header-actions{display:flex;gap:8px;align-items:center}
  #app{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  .hero{text-align:center;padding:20px 0 32px}
  .hero h1{font-size:30px;letter-spacing:-.5px;margin-bottom:10px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:14px}
  .notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:12px 16px;border-radius:12px;font-size:13.5px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(99,102,241,.13)}
  .card-cover{height:112px;display:flex;align-items:center;justify-content:center;
    font-size:46px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);overflow:hidden}
  .card-cover img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-body h3{font-size:15.5px;line-height:1.4}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
  .card-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto}
  .price{color:var(--danger);font-weight:800;font-size:19px}
  .price::before{content:'¥';font-size:13px;margin-right:1px}
  .stock{font-size:12px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-size:14px;
    font-weight:600;font-family:inherit;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    transition:filter .15s,opacity .15s}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:#f8f9ff;filter:none}
  .btn.small{padding:6px 13px;font-size:12.5px;border-radius:8px}
  .btn.big{width:100%;padding:15px;font-size:16px;margin-top:18px}
  .buy{width:100%;margin-top:4px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);
    background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(99,102,241,.13)}
  textarea{resize:vertical;line-height:1.6}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(3px);animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:400px;
    max-height:88vh;overflow-y:auto;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:17px;margin-bottom:6px}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-actions .btn{flex:1}
  .total{margin-top:16px;font-size:14px;color:var(--muted)}
  .total strong{color:var(--danger);font-size:19px}
  .order-wrap{max-width:620px;margin:0 auto}
  .order-wrap h2{font-size:20px;margin-bottom:18px}
  .order-info{background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:6px 20px}
  .order-info>div{display:flex;justify-content:space-between;gap:16px;
    padding:13px 0;border-bottom:1px solid var(--border);font-size:14px}
  .order-info>div:last-child{border-bottom:none}
  .order-info span{color:var(--muted);flex-shrink:0}
  .order-info b{text-align:right;word-break:break-all}
  .st-pending{color:var(--warn)}
  .st-paid{color:var(--ok)}
  .st-expired,.st-closed{color:var(--muted)}
  .cards-box{background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:20px;margin-top:18px}
  .cards-box h3{font-size:15px;margin-bottom:14px;color:var(--ok)}
  .card-code{display:flex;align-items:center;gap:10px;background:#f8f9ff;
    border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:9px}
  .card-code code{flex:1;font-size:13.5px;word-break:break-all;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .footer{border-top:1px solid var(--border);padding:26px 20px;text-align:center;
    font-size:13px;color:var(--muted);background:#fff}
  .footer-sub{margin-top:6px;font-size:12px;opacity:.7}
  @media(max-width:520px){
    .hero h1{font-size:23px}
    #app{padding:20px 14px 40px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .card-cover{height:88px;font-size:34px}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">🛒 <span id="siteName">自动发卡</span></div>
    <div class="header-actions">
      <button class="btn ghost small" id="queryBtn">订单查询</button>
      <a class="btn ghost small" id="adminLink" href="#" target="_blank">管理后台</a>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <div id="contact"></div>
  <div class="footer-sub">© 自动发卡平台 · 支付成功后系统自动发货</div>
</footer>

<div id="modal"></div>

<script>
/* ============================================================
 *  ⚠️ 部署前必改：把下面地址换成你的 Worker 地址
 *  （末尾不带斜杠）
 * ============================================================ */
const API_BASE = 'https://bmw-shop-api.968888u.workers.dev';

/* 后台链接（可选，跨域部署时指定） */
const ADMIN_URL = 'https://card-shop-admin.pages.dev';

/* ============================================================ */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const yuan = c => (Number(c || 0) / 100).toFixed(2);

let site = { siteName: '自动发卡', siteNotice: '', contact: '' };
let products = [];

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + '/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

(async function boot() {
  $('#adminLink').href = ADMIN_URL;
  try {
    site = await api('/site');
    document.title = site.siteName;
    $('#siteName').textContent = site.siteName;
    $('#contact').textContent = site.contact || '';
  } catch (e) {}
  await refreshProducts();
  $('#queryBtn').onclick = openQueryModal;
  window.addEventListener('hashchange', render);
  render();
})();

async function refreshProducts() {
  try { products = await api('/products'); } catch (e) { products = []; }
}

function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/order\/([A-Za-z0-9]+)$/);
  if (m) renderOrder(m[1]);
  else renderHome();
}

function renderHome() {
  const app = $('#app');
  const notice = site.siteNotice
    ? `<div class="notice">📢 ${esc(site.siteNotice)}</div>` : '';
  const grid = products.length
    ? products.map(p => `
      <div class="card">
        <div class="card-cover">${coverHtml(p.cover)}</div>
        <div class="card-body">
          <h3>${esc(p.name)}</h3>
          <p class="desc">${esc(p.description || '')}</p>
          <div class="card-foot">
            <span class="price">${yuan(p.price)}</span>
            <span class="stock">库存 ${p.stock}</span>
          </div>
          <button class="btn buy" data-buy="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock > 0 ? '立即购买' : '已售罄'}
          </button>
        </div>
      </div>`).join('')
    : `<div class="empty">暂无在售商品</div>`;

  app.innerHTML = `
    <div class="hero">
      <h1>${esc(site.siteName)}</h1>
      <p>全天候自动发货 · 支付成功即刻出卡</p>
    </div>
    ${notice}
    <div class="grid">${grid}</div>`;

  app.querySelectorAll('[data-buy]').forEach(btn => {
    btn.onclick = () => openBuyModal(btn.dataset.buy);
  });
}

function coverHtml(cover) {
  if (cover && /^https?:\/\//i.test(cover)) {
    return `<img src="${esc(cover)}" alt="" loading="lazy">`;
  }
  return esc(cover || '🛒');
}

function openBuyModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>购买 ${esc(p.name)}</h3>
        <label>购买数量</label>
        <input type="number" id="qty" value="1" min="1" max="${Math.min(100, p.stock)}">
        <label>联系方式（选填，便于售后）</label>
        <input type="text" id="contact" placeholder="邮箱 / QQ / 手机号">
        <div class="total">应付金额：<strong id="total">¥${yuan(p.price)}</strong></div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancel">取消</button>
          <button class="btn" id="confirm">提交订单</button>
        </div>
      </div>
    </div>`;

  const qtyEl = $('#qty', m);
  const totalEl = $('#total', m);
  const readQty = () => Math.max(1, Math.min(p.stock, Math.floor(Number(qtyEl.value) || 1)));

  qtyEl.oninput = () => { totalEl.textContent = '¥' + yuan(p.price * readQty()); };
  $('#cancel', m).onclick = () => { m.innerHTML = ''; };
  $('#confirm', m).onclick = async () => {
    const btn = $('#confirm', m);
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const order = await api('/orders', {
        method: 'POST',
        body: {
          productId: p.id,
          quantity: readQty(),
          contact: $('#contact', m).value.trim(),
        },
      });
      m.innerHTML = '';
      location.hash = '#/order/' + order.orderNo;
    } catch (e) {
      alert(e.message);
      btn.disabled = false; btn.textContent = '提交订单';
    }
  };
}

const STATUS_TEXT = { pending:'待支付', paid:'已支付', expired:'已过期', closed:'已关闭' };

async function renderOrder(orderNo) {
  const app = $('#app');
  app.innerHTML = `<div class="loading">订单加载中…</div>`;
  let order;
  try {
    order = await api('/orders/' + encodeURIComponent(orderNo));
  } catch (e) {
    app.innerHTML = `<div class="empty">订单不存在或链接已失效</div>`;
    return;
  }

  let html = `
    <div class="order-wrap">
      <h2>订单详情</h2>
      <div class="order-info">
        <div><span>订单号</span><b>${esc(order.orderNo)}</b></div>
        <div><span>商品名称</span><b>${esc(order.productName)}</b></div>
        <div><span>购买数量</span><b>${order.quantity}</b></div>
        <div><span>订单金额</span><b class="price">${yuan(order.amount)}</b></div>
        <div><span>订单状态</span><b class="st-${order.status}">${STATUS_TEXT[order.status] || order.status}</b></div>
      </div>`;

  if (order.status === 'paid') {
    html += `
      <div class="cards-box">
        <h3>🎉 发货成功，请及时保存您的卡密</h3>
        ${order.cards.map((c, i) => `
          <div class="card-code">
            <code>${esc(c.code)}</code>
            <button class="btn small copy" data-i="${i}">复制</button>
          </div>`).join('')}
      </div>`;
  } else if (order.status === 'pending') {
    html += `
      <button class="btn big" id="payBtn">立即支付 ¥${yuan(order.amount)}</button>
      <p class="hint">演示环境：点击后模拟支付成功并自动发货</p>`;
  } else {
    html += `<p class="hint">该订单${STATUS_TEXT[order.status] || '状态未知'}，请重新下单</p>`;
  }

  html += `</div>`;
  app.innerHTML = html;

  const payBtn = $('#payBtn', app);
  if (payBtn) {
    payBtn.onclick = async () => {
      payBtn.disabled = true;
      payBtn.textContent = '支付处理中…';
      try {
        await api('/orders/' + encodeURIComponent(orderNo) + '/pay', { method: 'POST' });
        await refreshProducts();
        renderOrder(orderNo);
      } catch (e) {
        alert(e.message);
        payBtn.disabled = false;
        payBtn.textContent = '立即支付 ¥' + yuan(order.amount);
      }
    };
  }

  app.querySelectorAll('.copy').forEach(b => {
    b.onclick = () => {
      const code = order.cards[Number(b.dataset.i)].code;
      navigator.clipboard.writeText(code).then(() => {
        b.textContent = '已复制';
        setTimeout(() => (b.textContent = '复制'), 1500);
      }).catch(() => alert('复制失败，请手动选中复制'));
    };
  });
}

function openQueryModal() {
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>订单查询</h3>
        <label>请输入订单号</label>
        <input id="qno" placeholder="粘贴您的订单号">
        <div class="modal-actions">
          <button class="btn ghost" id="qCancel">取消</button>
          <button class="btn" id="qGo">查询</button>
        </div>
      </div>
    </div>`;

  const input = $('#qno', m);
  input.focus();
  $('#qCancel', m).onclick = () => { m.innerHTML = ''; };
  const go = () => {
    const no = input.value.trim();
    if (!no) return;
    m.innerHTML = '';
    location.hash = '#/order/' + encodeURIComponent(no);
  };
  $('#qGo', m).onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}
</script>
</body>
</html>
