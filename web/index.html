<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自动发卡 · 极速数字商品交易</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --primary: #0071e3;
    --primary-hover: #0077ed;
    --border: #d2d2d7;
    --success: #10b981;
    --warning: #f59e0b;
  }
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    background-color: var(--bg); 
    color: var(--text); 
    min-height: 100vh;
    display: flex; 
    flex-direction: column; 
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  
  a { color: inherit; text-decoration: none; }

  /* 苹果风毛玻璃导航栏 */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(245, 245, 247, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }
  .header-inner {
    max-width: 1024px; margin: 0 auto; padding: 0 20px; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 6px; letter-spacing: -0.02em;
  }
  .header-actions { display: flex; gap: 12px; }
  
  /* 按钮系统 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 14px; border-radius: 980px; border: none; cursor: pointer; 
    font-size: 13px; font-weight: 500; transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  
  .btn-primary { background: var(--text); color: #fff; }
  .btn-blue { background: var(--primary); color: #fff; }
  .btn-blue:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid transparent; }
  .btn-outline:hover { text-decoration: underline; }

  /* 主体容器 */
  #app {
    flex: 1; width: 100%; max-width: 1024px; margin: 0 auto; padding: 32px 20px 80px;
  }

  /* ================= 苹果风极简布局 ================= */

  /* 1. 极简文字横幅 (抛弃巨大卡片) */
  .hero {
    text-align: center; margin-bottom: 40px; padding-top: 20px;
  }
  .hero h1 {
    font-size: 40px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; margin-bottom: 12px;
  }
  .hero h1 span { color: var(--muted); }
  .hero p {
    color: var(--muted); font-size: 16px; line-height: 1.4; max-width: 500px; margin: 0 auto 20px; letter-spacing: -0.01em;
  }
  .hero-actions { display: flex; justify-content: center; gap: 16px; }
  .hero-actions .btn { font-size: 15px; padding: 8px 20px; }

  /* 2. 特性栏 (极致紧凑) */
  .features {
    display: flex; justify-content: center; gap: 40px; margin-bottom: 50px;
    padding: 20px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .feature { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); font-weight: 500; }
  .feature span.icon { font-size: 18px; }

  /* 3. 商品区 */
  .section-header {
    display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;
  }
  .section-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  
  /* 分类标签 */
  .tabs-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
  .tabs-wrapper::-webkit-scrollbar { display: none; }
  .tabs { display: flex; gap: 10px; width: max-content; padding-bottom: 4px; }
  .tab {
    padding: 6px 16px; border-radius: 980px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: transparent; color: var(--muted); border: 1px solid var(--border); transition: all 0.2s; white-space: nowrap;
  }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* 商品网格: 移动端 2 列 (超紧凑) */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  
  .card {
    background: var(--card-bg); border-radius: 18px; overflow: hidden; 
    display: flex; flex-direction: column; transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .card:active { transform: scale(0.98); }
  
  .card-cover { height: 110px; background: #e5e5ea; position: relative; overflow: hidden; }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; }
  .card-cover .emoji { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  
  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-body h3 {
    font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--text); letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .desc {
    font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1;
  }
  
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .price { color: var(--text); font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .price::before { content: '¥'; font-size: 12px; margin-right: 1px; color: var(--muted); font-weight: 400; }
  .card-foot .btn { padding: 4px 12px; font-size: 12px; border-radius: 980px; background: var(--text); color: #fff; }

  /* 弹窗系统 (苹果风底部弹出) */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(5px); animation: fadeIn 0.2s ease;
  }
  .modal {
    background: #f5f5f7; border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 500px;
    max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; }
  .total { margin-top: 20px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .total strong { color: var(--text); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }

  label { display: block; font-size: 13px; color: var(--text); margin: 16px 0 8px; font-weight: 500; }
  input, textarea, select {
    width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; font-family: inherit; color: var(--text); background: #fff; outline: none; transition: all 0.2s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }

  /* 订单详情页 */
  .order-wrap { max-width: 600px; margin: 0 auto; }
  .order-wrap h2 { font-size: 24px; margin-bottom: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .order-info { background: #fff; border-radius: 18px; padding: 0 20px; }
  .order-info > div { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .order-info > div:last-child { border-bottom: none; }
  .order-info span { color: var(--muted); }
  .order-info b { text-align: right; word-break: break-all; font-weight: 500; }

  .st-pending { color: var(--warning); }
  .st-paid { color: var(--success); }
  .st-expired, .st-closed { color: var(--muted); }

  .cards-box { background: #fff; border-radius: 18px; padding: 20px; margin-top: 16px; }
  .cards-box h3 { font-size: 15px; margin-bottom: 16px; color: var(--success); display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .card-code { display: flex; align-items: center; gap: 12px; background: #f5f5f7; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .card-code code { flex: 1; font-size: 14px; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
  .footer { border-top: 1px solid var(--border); padding: 24px 20px; text-align: center; font-size: 12px; color: var(--muted); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ================= 电脑端适配 (768px 以上) ================= */
  @media (min-width: 768px) {
    #app { padding: 40px 20px 80px; }
    
    .hero { margin-bottom: 50px; padding-top: 40px; }
    .hero h1 { font-size: 56px; margin-bottom: 16px; }
    .hero p { font-size: 18px; max-width: 600px; }
    .hero-actions .btn { font-size: 16px; padding: 10px 24px; }

    .features { gap: 60px; margin-bottom: 60px; padding: 24px 0; }
    .feature { font-size: 14px; }

    .section-header { flex-direction: row; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
    .section-title { font-size: 32px; }
    .tabs-wrapper { margin: 0; padding: 0; overflow: visible; }
    .tab { padding: 8px 18px; font-size: 14px; }

    /* 电脑端一行 4 个 */
    .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card { border-radius: 20px; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .card-cover { height: 140px; }
    .card-body { padding: 20px; }
    .card-body h3 { font-size: 16px; }
    .desc { font-size: 13px; }
    .price { font-size: 20px; }
    .card-foot .btn { padding: 6px 16px; font-size: 13px; }

    /* 弹窗居中 */
    .modal-mask { align-items: center; }
    .modal { border-radius: 24px; padding: 32px; animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal h3 { font-size: 24px; }
    
    .order-wrap h2 { font-size: 32px; }
    .order-info { border-radius: 24px; padding: 0 32px; }
    .order-info > div { padding: 20px 0; }
    .cards-box { border-radius: 24px; padding: 32px; margin-top: 24px; }
    .card-code { padding: 16px 20px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo"> <span id="siteName">自动发卡</span></div>
    <div class="header-actions">
      <button class="btn btn-outline" id="queryBtn">查询订单</button>
      <a class="btn btn-primary" id="adminLink" href="#" target="_blank">管理后台</a>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading">加载中…</div>
</main>

<footer class="footer">
  <div id="contact" style="font-weight:500;margin-bottom:4px;color:var(--text)">联系客服</div>
  <div>© 自动发卡平台 · 安全稳定 · 自动发货</div>
</footer>

<div id="modal"></div>

<script>
const API_BASE = 'https://bmw-shop-api.968888u.workers.dev';
const ADMIN_URL = 'https://bmw-admin.pages.dev';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const yuan = c => (Number(c || 0) / 100).toFixed(2);

const DEMO_PRODUCTS = [
  { id: 'demo_1', name: 'Netflix 4K 高级会员', price: 1500, stock: 99, cover: 'https://images.unsplash.com/photo-1574375927938-d5a98e8efe85?auto=format&fit=crop&w=600&q=80', category: '影音娱乐', description: '4K UHD 极致画质，独立车位，付款后自动发送账号密码。' },
  { id: 'demo_2', name: 'Steam 充值卡 $20', price: 13800, stock: 50, cover: 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?auto=format&fit=crop&w=600&q=80', category: '游戏点卡', description: '全球区通用充值卡，秒发卡密，安全可靠，即买即用。' },
  { id: 'demo_3', name: 'Office 365 家庭版', price: 9900, stock: 20, cover: 'https://images.unsplash.com/photo-1633419461186-7d40a38105ec?auto=format&fit=crop&w=600&q=80', category: '软件授权', description: '支持 6 个账号共享，正版官方授权，永久有效。' },
  { id: 'demo_4', name: 'Spotify 高级会员', price: 1200, stock: 80, cover: 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?auto=format&fit=crop&w=600&q=80', category: '影音娱乐', description: '海量音乐畅听，无广告打扰，支持全球区。' }
];

let site = { siteName: '自动发卡', siteNotice: '', contact: '' };
let products = [];
let currentCategory = '全部';

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + '/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

(async function boot() {
  $('#adminLink').href = ADMIN_URL;
  try {
    site = await api('/site');
    document.title = site.siteName;
    $('#siteName').textContent = site.siteName;
    if(site.contact) $('#contact').textContent = site.contact;
  } catch (e) {}
  
  await refreshProducts();
  $('#queryBtn').onclick = openQueryModal;
  window.addEventListener('hashchange', render);
  render();
})();

async function refreshProducts() {
  try { 
    const realProducts = await api('/products'); 
    if (realProducts && realProducts.length > 0) {
      products = realProducts.map(p => ({...p, category: p.category || '最新上架'}));
    } else {
      products = DEMO_PRODUCTS;
    }
  } catch (e) { 
    products = DEMO_PRODUCTS; 
  }
}

function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/order\/([A-Za-z0-9]+)$/);
  if (m) renderOrder(m[1]);
  else renderHome();
}

function renderHome() {
  const app = $('#app');
  
  const categories = ['全部', ...new Set(products.map(p => p.category))];
  const filteredProducts = currentCategory === '全部' ? products : products.filter(p => p.category === currentCategory);

  const productGrid = filteredProducts.length ? filteredProducts.map(p => `
    <div class="card">
      <div class="card-cover">
        ${p.cover && p.cover.startsWith('http') ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : `<div class="emoji">${esc(p.cover || '📦')}</div>`}
      </div>
      <div class="card-body">
        <h3 title="${esc(p.name)}">${esc(p.name)}</h3>
        <p class="desc">${esc(p.description || '暂无描述')}</p>
        <div class="card-foot">
          <div class="price">${yuan(p.price)}</div>
          <button class="btn" data-buy="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock > 0 ? '购买' : '售罄'}
          </button>
        </div>
      </div>
    </div>`).join('')
    : `<div class="empty" style="grid-column: 1/-1;">该分类下暂无商品</div>`;

  app.innerHTML = `
    <div class="hero">
      <h1>全球数字商品<br><span>极速自动发卡</span></h1>
      <p>7x24 小时全天候自动发货，秒级响应，安全可靠。</p>
      <div class="hero-actions">
        <button class="btn btn-blue" onclick="document.getElementById('products-section').scrollIntoView({behavior: 'smooth'});">开始选购</button>
        <a class="btn btn-outline" href="${ADMIN_URL}" target="_blank">进入后台</a>
      </div>
    </div>

    <div class="features">
      <div class="feature"><span class="icon">⚡</span> 秒级自动发货</div>
      <div class="feature"><span class="icon">🛡️</span> 安全交易保障</div>
      <div class="feature"><span class="icon">💬</span> 全天候售后</div>
    </div>

    <div id="products-section">
      <div class="section-header">
        <h2 class="section-title">精选商品</h2>
        <div class="tabs-wrapper">
          <div class="tabs">
            ${categories.map(cat => `
              <button class="tab ${cat === currentCategory ? 'active' : ''}" data-cat="${esc(cat)}">${esc(cat)}</button>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="grid">${productGrid}</div>
    </div>
  `;

  app.querySelectorAll('[data-cat]').forEach(btn => {
    btn.onclick = () => {
      currentCategory = btn.dataset.cat;
      renderHome();
    };
  });

  app.querySelectorAll('[data-buy]').forEach(btn => {
    btn.onclick = () => openBuyModal(btn.dataset.buy);
  });
}

function openBuyModal(id) {
  if (id.startsWith('demo_')) {
    alert('💡 这是仅供展示的示例商品！\n\n请先登录管理后台，添加真实商品并录入卡密后，即可在此正常下单。');
    return;
  }

  const p = products.find(x => x.id === id);
  if (!p) return;
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>购买确认</h3>
        <p style="font-size:14px;color:var(--muted);margin-top:4px">${esc(p.name)}</p>
        <label>购买数量</label>
        <input type="number" id="qty" value="1" min="1" max="${Math.min(100, p.stock)}">
        <label>联系方式（选填）</label>
        <input type="text" id="contact" placeholder="邮箱 / QQ / 手机号">
        <div class="total">应付金额 <strong id="total">¥${yuan(p.price)}</strong></div>
        <div class="modal-actions">
          <button class="btn" style="background:#e5e5ea;color:#1d1d1f" id="cancel">取消</button>
          <button class="btn btn-blue" id="confirm">去支付</button>
        </div>
      </div>
    </div>`;

  const qtyEl = $('#qty', m);
  const totalEl = $('#total', m);
  const readQty = () => Math.max(1, Math.min(p.stock, Math.floor(Number(qtyEl.value) || 1)));
  
  qtyEl.oninput = () => { totalEl.textContent = '¥' + yuan(p.price * readQty()); };
  $('#cancel', m).onclick = () => { m.innerHTML = ''; };
  $('#confirm', m).onclick = async () => {
    const btn = $('#confirm', m);
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const order = await api('/orders', {
        method: 'POST',
        body: { productId: p.id, quantity: readQty(), contact: $('#contact', m).value.trim() },
      });
      m.innerHTML = '';
      location.hash = '#/order/' + order.orderNo;
    } catch (e) {
      alert(e.message); btn.disabled = false; btn.textContent = '去支付';
    }
  };
}

const STATUS_TEXT = { pending:'待支付', paid:'已支付', expired:'已过期', closed:'已关闭' };

async function renderOrder(orderNo) {
  const app = $('#app');
  app.innerHTML = `<div class="loading">订单加载中…</div>`;
  let order;
  try {
    order = await api('/orders/' + encodeURIComponent(orderNo));
  } catch (e) {
    app.innerHTML = `<div class="empty">❌ 订单不存在或链接已失效</div>`;
    return;
  }

  let html = `
    <div class="order-wrap">
      <h2>订单详情</h2>
      <div class="order-info">
        <div><span>订单号</span><b>${esc(order.orderNo)}</b></div>
        <div><span>商品名称</span><b>${esc(order.productName)}</b></div>
        <div><span>购买数量</span><b>${order.quantity}</b></div>
        <div><span>订单金额</span><b style="font-size:18px;color:var(--primary)">¥${yuan(order.amount)}</b></div>
        <div><span>订单状态</span><b class="st-${order.status}">${STATUS_TEXT[order.status] || order.status}</b></div>
      </div>`;

  if (order.status === 'paid') {
    html += `
      <div class="cards-box">
        <h3>✅ 发货成功，请及时保存</h3>
        ${order.cards.map((c, i) => `
          <div class="card-code">
            <code>${esc(c.code)}</code>
            <button class="btn btn-primary copy" data-i="${i}">复制</button>
          </div>`).join('')}
      </div>`;
  } else if (order.status === 'pending') {
    html += `
      <button class="btn btn-blue" style="width:100%;padding:16px;font-size:16px;margin-top:24px;border-radius:12px" id="payBtn">立即支付 ¥${yuan(order.amount)}</button>
      <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:16px">点击即模拟支付成功并自动发货</p>`;
  } else {
    html += `<p style="text-align:center;font-size:14px;color:var(--muted);margin-top:24px">该订单${STATUS_TEXT[order.status] || '状态未知'}，请重新下单</p>`;
  }

  html += `</div>`;
  app.innerHTML = html;

  const payBtn = $('#payBtn', app);
  if (payBtn) {
    payBtn.onclick = async () => {
      payBtn.disabled = true; payBtn.textContent = '支付处理中…';
      try {
        await api('/orders/' + encodeURIComponent(orderNo) + '/pay', { method: 'POST' });
        await refreshProducts();
        renderOrder(orderNo);
      } catch (e) {
        alert(e.message); payBtn.disabled = false; payBtn.textContent = '立即支付 ¥' + yuan(order.amount);
      }
    };
  }

  app.querySelectorAll('.copy').forEach(b => {
    b.onclick = () => {
      const code = order.cards[Number(b.dataset.i)].code;
      navigator.clipboard.writeText(code).then(() => {
        b.textContent = '已复制';
        setTimeout(() => { b.textContent = '复制'; }, 1500);
      }).catch(() => alert('复制失败，请手动选中复制'));
    };
  });
}

function openQueryModal() {
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>订单查询</h3>
        <p style="font-size:14px;color:var(--muted);margin-bottom:20px">输入订单号找回您的卡密</p>
        <input id="qno" placeholder="粘贴您的订单号">
        <div class="modal-actions">
          <button class="btn" style="background:#e5e5ea;color:#1d1d1f" id="qCancel">取消</button>
          <button class="btn btn-blue" id="qGo">查询</button>
        </div>
      </div>
    </div>`;
  const input = $('#qno', m);
  input.focus();
  $('#qCancel', m).onclick = () => { m.innerHTML = ''; };
  const go = () => {
    const no = input.value.trim();
    if (!no) return;
    m.innerHTML = '';
    location.hash = '#/order/' + encodeURIComponent(no);
  };
  $('#qGo', m).onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}
</script>
</body>
</html>
