<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动发卡 · 极速数字商品交易</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000; --card-bg: #0a0a0a;
    --text: #ededed; --muted: #888888;
    --primary: #3b82f6; --primary-hover: #2563eb;
    --border: #222222; --border-hover: #333333;
    --success: #10b981; --warning: #f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,"PingFang SC",sans-serif}
  body{
    background-color:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* 官网顶部光晕特效 */
  .glow-bg {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 1200px; height: 600px;
    background: radial-gradient(circle at 50% 0%, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
    z-index: -1; pointer-events: none;
  }

  /* 导航栏 */
  .header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.6);
    backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border)}
  .header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:72px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;letter-spacing:-0.5px;color:#fff}
  .logo .dot{width:8px;height:8px;background:var(--primary);border-radius:50%;box-shadow:0 0 10px var(--primary)}
  .header-actions{display:flex;gap:16px;align-items:center}
  
  /* 按钮系统 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;
    font-weight:500;transition:all .2s;}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:#fff;color:#000}
  .btn-primary:hover{background:#e5e5e5;transform:translateY(-1px)}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn-outline:hover{background:var(--card-bg);border-color:var(--border-hover)}
  .btn-blue{background:var(--primary);color:#fff;box-shadow:0 0 20px rgba(59,130,246,0.3)}
  .btn-blue:hover{background:var(--primary-hover);box-shadow:0 0 30px rgba(59,130,246,0.5);transform:translateY(-1px)}
  .btn-small{padding:8px 16px;font-size:13px}

  /* 主体区域 */
  #app{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:0 24px 100px;position:relative}
  
  /* Hero 区域 */
  .hero{text-align:center;padding:100px 0 80px;animation:fadeUp .8s ease}
  .hero h1{font-size:64px;line-height:1.1;letter-spacing:-2px;margin-bottom:24px;font-weight:800;
    background:linear-gradient(to right, #fff, #888);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:20px;line-height:1.6;max-width:600px;margin:0 auto 40px}
  .hero-cta{display:flex;justify-content:center;gap:16px}
  
  /* 特性介绍 */
  .features{display:grid;grid-template-columns:repeat(3, 1fr);gap:24px;margin-bottom:80px;border-top:1px solid var(--border);padding-top:40px}
  .feature{text-align:left}
  .feature-icon{font-size:24px;margin-bottom:16px;background:var(--card-bg);width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--border)}
  .feature h3{font-size:16px;font-weight:600;margin-bottom:8px}
  .feature p{font-size:14px;color:var(--muted);line-height:1.5}

  /* 商品分类与列表 */
  .section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
  .section-title{font-size:32px;font-weight:700;letter-spacing:-1px}
  
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
  .tab{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;
    background:transparent;color:var(--muted);border:1px solid transparent;transition:all .2s;white-space:nowrap}
  .tab.active{background:var(--card-bg);color:#fff;border-color:var(--border)}
  .tab:hover:not(.active){color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;display:flex;flex-direction:column;transition:all .3s ease;position:relative}
  .card:hover{transform:translateY(-4px);border-color:var(--border-hover);box-shadow:0 12px 30px rgba(0,0,0,0.5)}
  
  .card-cover{height:180px;background:#111;position:relative;overflow:hidden}
  .card-cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .card:hover .card-cover img{transform:scale(1.05)}
  .card-cover .emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}
  .card-tag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
    color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,0.1)}
    
  .card-body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card-category{font-size:12px;color:var(--primary);font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
  .card-body h3{font-size:18px;font-weight:600;line-height:1.4}
  .desc{font-size:14px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
  .price{color:#fff;font-weight:700;font-size:24px;display:flex;align-items:baseline;letter-spacing:-0.5px}
  .price::before{content:'¥';font-size:16px;margin-right:2px;color:var(--muted);font-weight:500}
  .stock{font-size:13px;color:var(--muted)}

  /* 弹窗系统 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(8px);animation:fadeIn .2s ease}
  .modal{background:#0a0a0a;border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:440px;
    max-height:88vh;overflow-y:auto;animation:scaleUp .3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:0 30px 60px -10px rgba(0,0,0,0.8)}
  .modal h3{font-size:24px;font-weight:700;margin-bottom:8px}
  .modal-actions{display:flex;gap:12px;margin-top:32px}
  .modal-actions .btn{flex:1;padding:14px}
  .total{margin-top:24px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);padding:16px;border-radius:12px;border:1px solid var(--border)}
  .total strong{color:#fff;font-size:24px;font-weight:700}

  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:500}
  input,textarea,select{width:100%;padding:12px 16px;border:1px solid var(--border);
    border-radius:8px;font-size:14px;font-family:inherit;color:#fff;
    background:#111;outline:none;transition:all .2s}
  input:focus,textarea:focus,select:focus{border-color:#555}

  /* 订单页 */
  .order-wrap{max-width:680px;margin:40px auto 0}
  .order-wrap h2{font-size:28px;margin-bottom:24px;font-weight:700}
  .order-info{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:0 24px}
  .order-info>div{display:flex;justify-content:space-between;gap:16px;
    padding:20px 0;border-bottom:1px solid var(--border);font-size:14px}
  .order-info>div:last-child{border-bottom:none}
  .order-info span{color:var(--muted)}
  .order-info b{text-align:right;word-break:break-all;font-weight:500}

  .st-pending{color:var(--warning);background:rgba(245,158,11,.1);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}
  .st-paid{color:var(--success);background:rgba(16,185,129,.1);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}
  .st-expired,.st-closed{color:var(--muted);background:rgba(255,255,255,.05);padding:4px 10px;border-radius:6px;font-size:12px}

  .cards-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:24px}
  .cards-box h3{font-size:16px;margin-bottom:16px;color:var(--success);display:flex;align-items:center;gap:8px}
  .card-code{display:flex;align-items:center;gap:12px;background:#111;
    border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .card-code code{flex:1;font-size:14px;word-break:break-all;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;letter-spacing:0.5px}
  
  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}
  .loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}
  .footer{border-top:1px solid var(--border);padding:40px 24px;text-align:center;font-size:13px;color:var(--muted)}
  
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scaleUp{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}

  @media(max-width:768px){
    .hero h1{font-size:40px}
    .hero{padding:60px 0 40px}
    .hero p{font-size:16px}
    .hero-cta{flex-direction:column}
    .features{grid-template-columns:1fr;gap:32px}
    .grid{grid-template-columns:1fr}
    .section-header{flex-direction:column;align-items:flex-start;gap:16px}
  }
</style>
</head>
<body>
<div class="glow-bg"></div>

<header class="header">
  <div class="header-inner">
    <div class="logo"><div class="dot"></div> <span id="siteName">自动发卡</span></div>
    <div class="header-actions">
      <button class="btn btn-outline btn-small" id="queryBtn">订单查询</button>
      <a class="btn btn-primary btn-small" id="adminLink" href="#" target="_blank">管理后台</a>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading">加载中…</div>
</main>

<footer class="footer">
  <div id="contact" style="font-weight:600;margin-bottom:8px;color:#fff">联系客服</div>
  <div>© 自动发卡平台 · 安全稳定 · 自动发货</div>
</footer>

<div id="modal"></div>

<script>
// 你的专属接口和后台地址
const API_BASE = 'https://bmw-shop-api.968888u.workers.dev';
const ADMIN_URL = 'https://bmw-admin.pages.dev';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const yuan = c => (Number(c || 0) / 100).toFixed(2);

// 如果没有真实商品，展示这些精美的示例商品
const DEMO_PRODUCTS = [
  { id: 'demo_1', name: 'Netflix 4K 高级会员', price: 1500, stock: 99, cover: 'https://images.unsplash.com/photo-1574375927938-d5a98e8efe85?auto=format&fit=crop&w=600&q=80', category: '影音娱乐', description: '4K UHD 极致画质，独立车位，付款后自动发送账号密码。' },
  { id: 'demo_2', name: 'Steam 充值卡 $20', price: 13800, stock: 50, cover: 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?auto=format&fit=crop&w=600&q=80', category: '游戏点卡', description: '全球区通用充值卡，秒发卡密，安全可靠，即买即用。' },
  { id: 'demo_3', name: 'Office 365 家庭版 (1年)', price: 9900, stock: 20, cover: 'https://images.unsplash.com/photo-1633419461186-7d40a38105ec?auto=format&fit=crop&w=600&q=80', category: '软件授权', description: '支持 6 个账号共享，正版官方授权，永久有效，含 1TB OneDrive。' }
];

let site = { siteName: '自动发卡', siteNotice: '', contact: '' };
let products = [];
let currentCategory = '全部';

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + '/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

(async function boot() {
  $('#adminLink').href = ADMIN_URL;
  try {
    site = await api('/site');
    document.title = site.siteName;
    $('#siteName').textContent = site.siteName;
    if(site.contact) $('#contact').textContent = site.contact;
  } catch (e) {}
  
  await refreshProducts();
  $('#queryBtn').onclick = openQueryModal;
  window.addEventListener('hashchange', render);
  render();
})();

async function refreshProducts() {
  try { 
    const realProducts = await api('/products'); 
    if (realProducts && realProducts.length > 0) {
      // 真实商品没有分类，默认归为“全部商品”
      products = realProducts.map(p => ({...p, category: '最新上架'}));
    } else {
      // 如果没有添加任何真实商品，展示示例数据
      products = DEMO_PRODUCTS;
    }
  } catch (e) { 
    products = DEMO_PRODUCTS; 
  }
}

function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/order\/([A-Za-z0-9]+)$/);
  if (m) renderOrder(m[1]);
  else renderHome();
}

function renderHome() {
  const app = $('#app');
  
  // 提取所有分类
  const categories = ['全部', ...new Set(products.map(p => p.category))];
  
  // 过滤当前分类
  const filteredProducts = currentCategory === '全部' ? products : products.filter(p => p.category === currentCategory);

  const productGrid = filteredProducts.length ? filteredProducts.map(p => `
    <div class="card">
      <div class="card-cover">
        ${p.cover && p.cover.startsWith('http') ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : `<div class="emoji">${esc(p.cover || '📦')}</div>`}
        <div class="card-tag">${esc(p.category)}</div>
      </div>
      <div class="card-body">
        <h3>${esc(p.name)}</h3>
        <p class="desc">${esc(p.description || '暂无描述')}</p>
        <div class="card-foot">
          <div>
            <div class="price">${yuan(p.price)}</div>
          </div>
          <button class="btn btn-blue" data-buy="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock > 0 ? '立即购买' : '已售罄'}
          </button>
        </div>
      </div>
    </div>`).join('')
    : `<div class="empty" style="grid-column: 1/-1;">该分类下暂无商品</div>`;

  app.innerHTML = `
    <div class="hero">
      <h1>全球数字商品<br>极速自动发卡</h1>
      <p>7x24 小时全天候自动发货，秒级响应，安全可靠，为您提供极致的数字商品购买体验。</p>
      <div class="hero-cta">
        <button class="btn btn-primary" onclick="document.getElementById('products-section').scrollIntoView({behavior: 'smooth'});">开始选购</button>
        <a class="btn btn-outline" href="${ADMIN_URL}" target="_blank">进入后台</a>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <h3>秒级自动发货</h3>
        <p>付款成功后，系统立刻从卡密库调取商品发送给您，无需等待人工处理。</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🛡️</div>
        <h3>安全交易保障</h3>
        <p>全站 HTTPS 加密传输，保障您的支付安全与隐私数据不被泄露。</p>
      </div>
      <div class="feature">
        <div class="feature-icon">💬</div>
        <h3>全天候售后支持</h3>
        <p>如遇任何商品问题，可通过页面底部联系方式随时联系客服处理。</p>
      </div>
    </div>

    <div id="products-section" style="padding-top: 40px;">
      <div class="section-header">
        <h2 class="section-title">精选商品</h2>
        <div class="tabs">
          ${categories.map(cat => `
            <button class="tab ${cat === currentCategory ? 'active' : ''}" data-cat="${esc(cat)}">${esc(cat)}</button>
          `).join('')}
        </div>
      </div>
      <div class="grid">${productGrid}</div>
    </div>
  `;

  // 绑定分类切换
  app.querySelectorAll('[data-cat]').forEach(btn => {
    btn.onclick = () => {
      currentCategory = btn.dataset.cat;
      renderHome();
    };
  });

  // 绑定购买
  app.querySelectorAll('[data-buy]').forEach(btn => {
    btn.onclick = () => openBuyModal(btn.dataset.buy);
  });
}

function openBuyModal(id) {
  // 拦截演示商品的购买
  if (id.startsWith('demo_')) {
    alert('💡 这是仅供展示的示例商品！\n\n请先登录管理后台，添加真实商品并录入卡密后，即可在此正常下单。');
    return;
  }

  const p = products.find(x => x.id === id);
  if (!p) return;
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>购买确认</h3>
        <p style="font-size:15px;color:var(--muted);margin-top:8px">${esc(p.name)}</p>
        <label>购买数量</label>
        <input type="number" id="qty" value="1" min="1" max="${Math.min(100, p.stock)}">
        <label>联系方式（选填，便于售后）</label>
        <input type="text" id="contact" placeholder="邮箱 / QQ / 手机号">
        <div class="total">应付总额 <strong id="total">¥${yuan(p.price)}</strong></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancel">取消</button>
          <button class="btn btn-primary" id="confirm">去支付</button>
        </div>
      </div>
    </div>`;

  const qtyEl = $('#qty', m);
  const totalEl = $('#total', m);
  const readQty = () => Math.max(1, Math.min(p.stock, Math.floor(Number(qtyEl.value) || 1)));
  
  qtyEl.oninput = () => { totalEl.textContent = '¥' + yuan(p.price * readQty()); };
  $('#cancel', m).onclick = () => { m.innerHTML = ''; };
  $('#confirm', m).onclick = async () => {
    const btn = $('#confirm', m);
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const order = await api('/orders', {
        method: 'POST',
        body: { productId: p.id, quantity: readQty(), contact: $('#contact', m).value.trim() },
      });
      m.innerHTML = '';
      location.hash = '#/order/' + order.orderNo;
    } catch (e) {
      alert(e.message); btn.disabled = false; btn.textContent = '去支付';
    }
  };
}

const STATUS_TEXT = { pending:'待支付', paid:'已支付', expired:'已过期', closed:'已关闭' };

async function renderOrder(orderNo) {
  const app = $('#app');
  app.innerHTML = `<div class="loading">订单加载中…</div>`;
  let order;
  try {
    order = await api('/orders/' + encodeURIComponent(orderNo));
  } catch (e) {
    app.innerHTML = `<div class="empty">❌ 订单不存在或链接已失效</div>`;
    return;
  }

  let html = `
    <div class="order-wrap">
      <h2>订单详情</h2>
      <div class="order-info">
        <div><span>订单号</span><b>${esc(order.orderNo)}</b></div>
        <div><span>商品名称</span><b>${esc(order.productName)}</b></div>
        <div><span>购买数量</span><b>${order.quantity}</b></div>
        <div><span>订单金额</span><b style="font-size:18px;color:#fff">¥${yuan(order.amount)}</b></div>
        <div><span>订单状态</span><b class="st-${order.status}">${STATUS_TEXT[order.status] || order.status}</b></div>
      </div>`;

  if (order.status === 'paid') {
    html += `
      <div class="cards-box">
        <h3>✅ 发货成功，请及时保存</h3>
        ${order.cards.map((c, i) => `
          <div class="card-code">
            <code>${esc(c.code)}</code>
            <button class="btn btn-outline btn-small copy" data-i="${i}">复制</button>
          </div>`).join('')}
      </div>`;
  } else if (order.status === 'pending') {
    html += `
      <button class="btn btn-blue" style="width:100%;padding:16px;font-size:16px;margin-top:24px;border-radius:12px" id="payBtn">立即支付 ¥${yuan(order.amount)}</button>
      <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:16px">点击即模拟支付成功并自动发货</p>`;
  } else {
    html += `<p style="text-align:center;font-size:14px;color:var(--muted);margin-top:24px">该订单${STATUS_TEXT[order.status] || '状态未知'}，请重新下单</p>`;
  }

  html += `</div>`;
  app.innerHTML = html;

  const payBtn = $('#payBtn', app);
  if (payBtn) {
    payBtn.onclick = async () => {
      payBtn.disabled = true; payBtn.textContent = '支付处理中…';
      try {
        await api('/orders/' + encodeURIComponent(orderNo) + '/pay', { method: 'POST' });
        await refreshProducts();
        renderOrder(orderNo);
      } catch (e) {
        alert(e.message); payBtn.disabled = false; payBtn.textContent = '立即支付 ¥' + yuan(order.amount);
      }
    };
  }

  app.querySelectorAll('.copy').forEach(b => {
    b.onclick = () => {
      const code = order.cards[Number(b.dataset.i)].code;
      navigator.clipboard.writeText(code).then(() => {
        b.textContent = '已复制';
        setTimeout(() => { b.textContent = '复制'; }, 1500);
      }).catch(() => alert('复制失败，请手动选中复制'));
    };
  });
}

function openQueryModal() {
  const m = $('#modal');
  m.innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>订单查询</h3>
        <p style="font-size:14px;color:var(--muted);margin-top:8px;margin-bottom:24px">输入订单号找回您的卡密</p>
        <input id="qno" placeholder="粘贴您的订单号">
        <div class="modal-actions">
          <button class="btn btn-outline" id="qCancel">取消</button>
          <button class="btn btn-primary" id="qGo">查询</button>
        </div>
      </div>
    </div>`;
  const input = $('#qno', m);
  input.focus();
  $('#qCancel', m).onclick = () => { m.innerHTML = ''; };
  const go = () => {
    const no = input.value.trim();
    if (!no) return;
    m.innerHTML = '';
    location.hash = '#/order/' + encodeURIComponent(no);
  };
  $('#qGo', m).onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}
</script>
</body>
</html>
